services:
  actual:
    container_name: actual
    image: actualbudget/actual-server:25.12.0
    restart: unless-stopped

    volumes:
      # Here is where actual will save the files
      - "/home/fics/docker/actual/data:/data"

    environment:
      TZ: "Europe/Madrid"
      # Optional: Server internal port (by default is 5006)
      ACTUAL_PORT: 5006

    networks:
      proxy:

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.actual.entrypoints=http"
      - "traefik.http.routers.actual.rule=Host(`actual.yourdomain.com`)"
      - "traefik.http.middlewares.actual-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.actual.middlewares=actual-https-redirect"

      - "traefik.http.routers.actual-secure.entrypoints=https"
      - "traefik.http.routers.actual-secure.rule=Host(`actual.yourdomain.com`)"
      - "traefik.http.routers.actual-secure.tls=true"
      - "traefik.http.routers.actual-secure.service=actual"

      - "traefik.http.services.actual.loadbalancer.server.port=5006"

      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true